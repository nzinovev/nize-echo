# Local development services. Production Compose lives in deploy/.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nize
      POSTGRES_PASSWORD: nize
      POSTGRES_DB: nize_echo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nize -d nize_echo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
