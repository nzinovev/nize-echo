# Live reload for `make dev-go`: rebuilds and restarts the server on change.
root = "."
tmp_dir = "bin/air-tmp"

[build]
  cmd = "go build -o ./bin/site-dev ./cmd/site"
  entrypoint = ["./bin/site-dev"]
  include_ext = ["go", "html", "sql", "css", "json"]
  exclude_dir = ["admin", "bin", "design", "deploy", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
